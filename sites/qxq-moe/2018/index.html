<head>

<body>
    <div id="load-mask">
        <div>
            <div class="loader" id="loader-1"></div>
            <div class="loader" id="loader-2"></div>
            <div class="loader" id="loader-3"></div>
            <div class="loader" id="loader-4"></div>
        </div>
    </div>
    <div id="container">
        <div id="card">
            <div id="side">
                <div id="side-top">
                    <div id="id">
                        <!-- <img src="" alt="Avatar" id="avatar"> -->
                        <img src="https://www.liqiang.info/assets/icon/avatar.jpg"

                        <div id="menu">

                    </div>
                </div>

                            <i id="menu-icon-2"></i>

                </div>
            </div>
            <div id="profile">

                </div>
                <div>

                        更多信息
                    </h2>

                            <li>牛马开发者</li>
                            <li>是<span style="opacity:.3">小透明</span>，<span class="hover-black">性格大概内向吧</span></li>
                        </ul>

                            <li>玩三国杀，<span class="hover-black">偶尔打打 osu!（很菜就是了）</span></li>

                </div>
                <div>
                    <h2 class="profile-title">
                        也许活跃于……
                    </h2>
                    <div class="profile-main">
                        <div id="contact">
                            <a title="当阅读器的 Telegram" class="icon icon-telegram" href="https://"></a>
                            <a title="只会点赞的 Twitter" class="icon icon-twitter" href="https://"></a>
                            <a title="开机自启的 Steam" class="icon icon-steam" href="https://"></a>
                            <a title="不经常看的 E-mail" class="icon icon-mail" href="mailto:"></a>

                    </div>
                </div>
            </div>
        </div>
