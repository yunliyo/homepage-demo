<!doctype html>
<html lang="zh">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1.0, shrink-to-fit=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>韵狸 - 一个热爱诗词书画的程序员 | 馀事做诗人！</title>
    <link rel="icon" href="../../images/avatar.jpg" type="image/x-icon">
    <script>
        (function () {
            var t = localStorage.getItem("theme");
            if (t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
                document.documentElement.classList.add("dark");
            }
        })();
    </script>
    <style>
        /* ── Reset ── */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ── Tokens ── */
        :root {
            --bg: #F8F2F5;
            --surface: #e8d9ec;
            --surface-active: #d5c0dd;
            --border: #d9c2df;
            --text: #171717;
            --text-2: #6b6b6b;
            --text-3: #b0b0b0;
            --radius: 14px;
            --dur: 0.14s;
        }

        html.dark {
            --bg: #0f0f0f;
            --surface: #1c1c1c;
            --surface-active: #262626;
            --border: #2e2e2e;
            --text: #f5f5f5;
            --text-2: #999999;
            --text-3: #4a4a4a;
            --primary: #8d4bbb;
        }

        /* ── Base ── */
        html {
            font-family: "Inter", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            /* smooth theme transitions */
            transition: background var(--dur) ease, color var(--dur) ease;
        }

        body {
            min-height: 100svh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* safe area for notched phones */
            padding: max(2.5rem, env(safe-area-inset-top)) max(1.25rem, env(safe-area-inset-right)) max(2.5rem, env(safe-area-inset-bottom)) max(1.25rem, env(safe-area-inset-left));
            -webkit-tap-highlight-color: transparent;
        }

        /* ── Theme button ── */
        #theme-btn {
            position: fixed;
            top: max(1.1rem, env(safe-area-inset-top));
            right: max(1.1rem, env(safe-area-inset-right));
            z-index: 10;
            width: 40px;
            height: 40px;
            border: 1px solid var(--border);
            border-radius: 50%;
            background: var(--surface);
            color: var(--text-2);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            transition: background var(--dur) ease, border-color var(--dur) ease, color var(--dur) ease;
            -webkit-tap-highlight-color: transparent;
        }

        #theme-btn:active {
            background: var(--surface-active);
        }

        @media (hover: hover) {
            #theme-btn:hover {
                background: var(--surface-active);
                color: var(--text);
            }
        }

        /* ── Wrapper ── */
        .wrap {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2.25rem;
        }

        /* ── Profile ── */
        .profile {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.7rem;
            text-align: center;
        }

        .avatar {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 1.5px solid var(--border);
            object-fit: cover;
            display: block;
            /* prevent layout shift */
            aspect-ratio: 1;
            transition: border-color var(--dur) ease;
        }

        .name {
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: -0.025em;
            color: var(--text);
        }

        .tagline {
            font-size: 0.9rem;
            color: var(--text-2);
            line-height: 1.55;
            max-width: 26ch;
            transition: color var(--dur) ease;
        }

        /* ── Links list ── */
        .links {
            width: 100%;
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 0.55rem;
        }

        .links a {
            display: flex;
            align-items: center;
            gap: 0.85rem;
            /* generous touch target */
            min-height: 58px;
            padding: 0 1rem;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            background: var(--surface);
            color: var(--text);
            text-decoration: none;
            touch-action: manipulation;
            transition: background var(--dur) ease, border-color var(--dur) ease;
            -webkit-tap-highlight-color: transparent;
            /* prevent text selection on fast taps */
            user-select: none;
            -webkit-user-select: none;
        }

        .links a:active {
            background: var(--surface-active);
        }

        @media (hover: hover) {
            .links a:hover {
                background: var(--surface-active);
                border-color: var(--text-3);
            }

            .links a:hover .arrow {
                color: var(--text-2);
                transform: translate(2px, -2px);
            }
        }

        /* ── Link icon box ── */
        .icon-box {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            border-radius: 9px;
            border: 1px solid var(--border);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-2);
            transition: border-color var(--dur) ease, background var(--dur) ease;
        }

        /* ── Link text ── */
        .link-text {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .link-title {
            font-size: 0.925rem;
            font-weight: 500;
            color: var(--text);
            line-height: 1.3;
        }

        .link-sub {
            font-size: 0.8rem;
            color: var(--text-2);
            line-height: 1.3;
            /* truncate if too long */
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: color var(--dur) ease;
        }

        /* ── Arrow ── */
        .arrow {
            flex-shrink: 0;
            color: var(--text-3);
            transition: color var(--dur) ease, transform 0.12s ease;
        }

        /* ── Footer ── */
        .foot {
            font-size: 0.75rem;
            color: var(--text-3);
            transition: color var(--dur) ease;
        }

        /* ── Entry animation ── */
        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(12px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .wrap {
            animation: rise 0.38s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @media (prefers-reduced-motion: reduce) {
            .wrap {
                animation: none;
            }

            .links a,
            .arrow,
            #theme-btn {
                transition: none;
            }
        }
    </style>
</head>

<body>
    <!-- Theme toggle -->
    <button id="theme-btn" aria-label="Toggle dark mode" type="button">
        <svg id="sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
            <circle cx="12" cy="12" r="5" />
            <line x1="12" y1="1" x2="12" y2="3" />
            <line x1="12" y1="21" x2="12" y2="23" />
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
            <line x1="1" y1="12" x2="3" y2="12" />
            <line x1="21" y1="12" x2="23" y2="12" />
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
        </svg>
        <svg id="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
    </button>

    <div class="wrap">
        <!-- Profile -->
        <div class="profile">
            <img class="avatar" src="../../images/avatar.jpg" alt="Dogxi avatar"
                width="72" height="72" loading="eager" decoding="async" />
            <h1 class="name">韵狸</h1>
            <p class="tagline">一名热爱诗词创作的程序员</p>
        </div>

        <!-- Nav links -->
        <ul class="links" role="list">
            <li>
                <a href="./article/" target="_blank" rel="noopener noreferrer">
                    <span class="icon-box" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 19.5A2.5 2.5 0 0 1 4.5 17H20" />
                            <path d="M4.5 2H20v20H4.5A2.5 2.5 0 0 1 2 19.5v-15A2.5 2.5 0 0 1 4.5 2z" />
                        </svg>
                    </span>
                    <span class="link-text">
                        <span class="link-title">文学</span>
                        <span class="link-sub">韵狸的原创文章</span>
                    </span>
                    <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="7" y1="17" x2="17" y2="7" />
                        <polyline points="7 7 17 7 17 17" />
                    </svg>
                </a>
            </li>

            <li>
                <a href="./note/" target="_blank" rel="noopener noreferrer">
                    <span class="icon-box" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 19.5A2.5 2.5 0 0 1 4.5 17H20" />
                            <path d="M4.5 2H20v20H4.5A2.5 2.5 0 0 1 2 19.5v-15A2.5 2.5 0 0 1 4.5 2z" />
                        </svg>
                    </span>
                    <span class="link-text">
                        <span class="link-title">技术</span>
                        <span class="link-sub">韵狸的技术笔记</span>
                    </span>
                    <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="7" y1="17" x2="17" y2="7" />
                        <polyline points="7 7 17 7 17 17" />
                    </svg>
                </a>
            </li>

            <li>
                <a href="./resume/" target="_blank" rel="noopener noreferrer">
                    <span class="icon-box" aria-hidden="true">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M2 19.5A2.5 2.5 0 0 1 4.5 17H20" />
                            <path d="M4.5 2H20v20H4.5A2.5 2.5 0 0 1 2 19.5v-15A2.5 2.5 0 0 1 4.5 2z" />
                        </svg>
                    </span>
                    <span class="link-text">
                        <span class="link-title">简历</span>
                        <span class="link-sub">韵狸的简历</span>
                    </span>
                    <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="7" y1="17" x2="17" y2="7" />
                        <polyline points="7 7 17 7 17 17" />
                    </svg>
                </a>
            </li>
        </ul>

        <p class="foot">&copy; 2014-<script>document.write(new Date().getFullYear())</script> by 韵狸.</p>
    </div>
</body>

<script>
    var btn = document.getElementById("theme-btn");
    var sun = document.getElementById("sun");
    var moon = document.getElementById("moon");
    var html = document.documentElement;
    function sync() {
        var dark = html.classList.contains("dark");
        sun.style.display = dark ? "block" : "none";
        moon.style.display = dark ? "none" : "block";
    }
    sync();
    btn.addEventListener("click", function () {
        var dark = html.classList.toggle("dark");
        localStorage.setItem("theme", dark ? "dark" : "light");
        sync();
    });
</script>

</html>
