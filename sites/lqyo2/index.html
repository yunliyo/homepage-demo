<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yunli</title>
    <link rel="icon" href="../../images/avatar.jpg">
    <!-- 内联关键CSS -->
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #374151;
            --transition-speed: 0.3s;
        }
        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #ffffff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        body.loaded {
            opacity: 1;
        }
        .loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-color);
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <!-- 预连接常用域名 -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net">
    <!-- 异步加载非关键CSS -->
    <link rel="preload" href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="./css/style.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="./css/background.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="./css/cursor-styles.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <!-- 后备方案 -->
    <noscript>
        <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
        <link href="./css/style.css" rel="stylesheet">
        <link href="./css/background.css" rel="stylesheet">
        <link href="./css/cursor-styles.css" rel="stylesheet">
    </noscript>
</head>

                <animate attributeName="stroke-dasharray" from="1, 150" to="90, 150" dur="1.5s" repeatCount="indefinite"/>
                <animate attributeName="stroke-dashoffset" from="0" to="-120" dur="1.5s" repeatCount="indefinite"/>
            </circle>

    <!-- 优化的脚本加载 -->
    <script>
        // 页面加载性能监控
        const perfData = window.performance.timing;
        // 页面加载完成后处理
        window.addEventListener('load', function() {
            document.body.classList.add('loaded');
            document.querySelector('.loading').classList.add('hidden');
            // 延迟加载非关键脚本
            setTimeout(function() {
                const themeScript = document.createElement('script');
                themeScript.src = './js/theme.js';
                themeScript.defer = true;
                document.body.appendChild(themeScript);
                const fpsScript = document.createElement('script');
                fpsScript.src = './js/fps.js';
                fpsScript.defer = true;
                document.body.appendChild(fpsScript);
                // 输出页面加载时间（开发模式）
                if (window.location.search.includes('dev=true')) {
                    const loadTime = perfData.loadEventEnd - perfData.navigationStart;
                    console.log(`页面加载时间: ${loadTime}ms`);
                }
            }, 100);
        });
    </script>
</body>
</html>
